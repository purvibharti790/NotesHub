# ==============================================================================
# MySQL Production / Local Profile for NotesHub
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# ==============================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/noteshub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
