spring.application.name=noteshub-api
server.port=8081

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Local File Storage Directory
noteshub.upload.dir=../uploads

# Database Configuration (Zero-setup H2 database enabled by default)
# Stores data in ./data/noteshubdb so records persist across restarts
spring.datasource.url=jdbc:h2:file:./data/noteshubdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Static Frontend Web Serving (Directly serve frontend from ../frontend or ./frontend)
spring.web.resources.static-locations=classpath:/static/,file:../frontend/,file:./frontend/

